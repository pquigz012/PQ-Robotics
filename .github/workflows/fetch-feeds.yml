name: Fetch Drone News Feeds

on:
  schedule:
    # every 10 minutes, offset from the top of the hour when GitHub's schedulers are busiest
    - cron: '4-59/10 * * * *'
  workflow_dispatch:

# never run two fetches at once; a late run simply waits for the one before it
concurrency:
  group: fetch-feeds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch and merge RSS feeds
        run: python3 fetch_feeds.py

      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed-cache.json
          git diff --cached --quiet || (git commit -m "chore: update drone news feed cache" && git pull --rebase && git push)
